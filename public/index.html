<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThermoVision</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="animation.css">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main>
    <img src="assets\ThermoVision.svg" alt="ThermoVision logo" class="thermologo">
    <div class="chart-container">
      <canvas id="graphs"></canvas>
    </div>
    <img src="assets\ThermoVision.svg" alt="ThermoVision logo" class="thermologo-little">
    <video id="videosrc" muted playsinline></video>
    <div class="scene" id="scene">
      <div class="word">
        <span>Therm</span>
        <span class="o">o</span>
        <span class="vision">Vision</span>
      </div>
      <div class="actor">
        <svg viewBox="0 0 50 100" width="100%" height="100%">
          <rect x="18" y="5" width="14" height="68" rx="7" fill="#fff" stroke="#172033" stroke-width="4"/>
          <circle cx="25" cy="77" r="16" fill="#fff" stroke="#172033" stroke-width="4"/>
          <rect x="22" y="15" width="6" height="62" rx="3" fill="#ff4825"/>
          <circle cx="25" cy="77" r="10" fill="#ff4825"/>
          <path d="M33 20h7 M33 32h5 M33 44h7" stroke="#172033" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pulse"></div>
    </div>
  </main>
</body>
<script src="index.js"></script>
<script src="animation.js"></script>
</html>
