x-app: &app
  image: projetsin:local
  build: .
  init: true

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: projetsin
  DB_USER: projetsin
  DB_PSWD: ${MARIADB_PASSWORD:?Définir MARIADB_PASSWORD dans .env.docker}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: projetsin
      MARIADB_USER: projetsin
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Définir MARIADB_PASSWORD dans .env.docker}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Définir MARIADB_ROOT_PASSWORD dans .env.docker}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  migrate:
    <<: *app
    environment: *db-env
    command:
      - sh
      - -ec
      - |
        export DATABASE_URL="$$(node -e 'const e = process.env; process.stdout.write("mysql://" + encodeURIComponent(e.DB_USER) + ":" + encodeURIComponent(e.DB_PSWD) + "@" + e.DB_HOST + ":" + e.DB_PORT + "/" + encodeURIComponent(e.DB_NAME))')"
        exec node node_modules/prisma/build/index.js migrate deploy
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    environment: *db-env
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
